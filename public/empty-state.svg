<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <!-- pixel-art: ghostly cursor dropping a picture frame onto a dashed stage -->
  <g shape-rendering="crispEdges">
    <rect x="40" y="100" width="160" height="8" fill="#1C2231"/>
    <rect x="40" y="100" width="16" height="8" fill="#323D54"/>
    <rect x="72" y="100" width="16" height="8" fill="#323D54"/>
    <rect x="104" y="100" width="16" height="8" fill="#323D54"/>
    <rect x="136" y="100" width="16" height="8" fill="#323D54"/>
    <rect x="168" y="100" width="16" height="8" fill="#323D54"/>
    <!-- picture frame -->
    <rect x="88" y="40" width="64" height="48" fill="#151926" stroke="#FFB648" stroke-width="4"/>
    <rect x="96" y="56" width="16" height="16" fill="#4FD1B5"/>
    <rect x="112" y="64" width="32" height="16" fill="#323D54"/>
    <!-- pixel cursor arrow -->
    <g fill="#EDEFF5">
      <rect x="152" y="16" width="6" height="6"/>
      <rect x="152" y="22" width="12" height="6"/>
      <rect x="152" y="28" width="18" height="6"/>
      <rect x="152" y="34" width="24" height="6"/>
      <rect x="152" y="40" width="12" height="6"/>
      <rect x="164" y="40" width="6" height="6"/>
      <rect x="164" y="46" width="12" height="6"/>
    </g>
  </g>
</svg>
